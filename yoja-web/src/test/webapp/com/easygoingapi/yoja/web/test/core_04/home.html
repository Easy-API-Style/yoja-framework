<!DOCTYPE html>
<html>
<head>
    <title>Yoja</title>
    <meta charset="utf-8"/>
    <script type="module"
            src="/yoja/YojaWeb-x.y.z.js"
            yw-config-path="/YojaWeb.conf.js"></script>
</head>
<body>
    <!-- three levels of sections, the deepest a slot to a file holding a section of its own -->
    <yw-section class="level-1" yw-controler="./mark.ctl.js">
        <span>one</span>
        <yw-section class="level-2" yw-controler="./mark.ctl.js">
            <span>two</span>
            <yw-section class="level-3" yw-slot="./slot.html"></yw-section>
        </yw-section>
    </yw-section>
    <div class="host"></div>
</body>
</html>
